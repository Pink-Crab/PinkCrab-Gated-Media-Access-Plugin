name: WordPress 6.9 Test Suite

# pull_request only — the runner discovers work via `act pull_request --list`.
# The source workflow also ran on push and filtered branches; both are dropped,
# as the local event payload carries only number, head.ref, head.sha, base.ref.
on:
  pull_request:

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      mysql-service:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 'root'
          MYSQL_DATABASE: wordpress_test
        # No `ports:` mapping — publishing 3306 on the host serialises the
        # whole run. The service is reached by name on the job network.
        options: >-
          --health-cmd="healthcheck.sh --connect || mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    # tests/wp-config.php reads these. The source set `environment_github: true`
    # instead, which hardcodes DB_HOST to 127.0.0.1 — that cannot reach the
    # service now the host port binding is gone.
    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
      WP_DB_HOST: mysql-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No shivammathur/setup-php: the runner image already provides mbstring,
      # intl, pcov and mysql, which is everything the source asked for.
      - name: Check PHP version
        run: php -v

      - name: Validate composer.json
        run: composer validate --no-check-publish

      # Every dependency resolves over https, so the runner needs no key.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: phpcs
        run: composer lint:php:phpcs

      - name: phpstan
        run: composer lint:php:phpstan

      - name: phpmd
        run: composer lint:php:phpmd

      # `composer test`, not `composer coverage` — the clover.xml the source
      # produced only existed to be uploaded, and artifact upload is dropped.
      - name: phpunit
        run: composer test
