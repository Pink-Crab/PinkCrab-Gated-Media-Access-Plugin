name: WordPress 6.9 Test Suite

# pull_request only — the runner discovers work via `act pull_request --list`.
# The source workflow also ran on push and filtered branches; both are dropped,
# as the local event payload carries only number, head.ref, head.sha, base.ref.
on:
  pull_request:

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      mysql-service:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 'root'
          MYSQL_DATABASE: wordpress_test
        # This publishes a host port, which takes the runner's global lock and
        # serialises the run. It is not a preference: act starts the job
        # container with network="host" while services sit on the job's bridge
        # network, so `mysql-service` has no DNS from inside the job. A
        # published port on 127.0.0.1 is the only route to it.
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect || mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    # tests/wp-config.php reads these. The host is 127.0.0.1 because the job
    # container is on the host network and reaches mysql through the published
    # port above, not by service name.
    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
      WP_DB_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No shivammathur/setup-php: the runner image already provides mbstring,
      # intl, pcov and mysql, which is everything the source asked for.
      - name: Check PHP version
        run: php -v

      - name: Validate composer.json
        run: composer validate --no-check-publish

      # Every dependency resolves over https, so the runner needs no key.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: phpcs
        run: composer lint:php:phpcs

      - name: phpstan
        run: composer lint:php:phpstan

      - name: phpmd
        run: composer lint:php:phpmd

      # `composer test`, not `composer coverage` — the clover.xml the source
      # produced only existed to be uploaded, and artifact upload is dropped.
      - name: phpunit
        run: composer test
