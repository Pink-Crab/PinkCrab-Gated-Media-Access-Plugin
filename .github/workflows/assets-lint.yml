name: Asset lint

# eslint and stylelint. wp-6-9.yml covers the PHP; nothing there looks at the front end.
#
# Both scripts name their own paths. Left bare, wp-scripts hands eslint and stylelint a `.` glob that descends into node_modules and vendor and never finishes.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: JS and CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: eslint
        run: npm run lint:js

      - name: stylelint
        run: npm run lint:style
